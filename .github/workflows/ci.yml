name: CI — Build & Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'
  # Dummy values so Next.js build doesn't fail on missing env vars
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

jobs:
  quality:
    name: 🔍 Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔎 TypeScript Type Check
        run: npx tsc --noEmit

  build:
    name: 🏗️ Production Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build
        run: npm run build

      - name: 📊 Bundle Analysis
        run: |
          echo "## 📦 Build Output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Production build completed successfully" >> $GITHUB_STEP_SUMMARY
          if [ -d ".next" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Build artifacts | $(find .next -name '*.js' | wc -l) JS files |" >> $GITHUB_STEP_SUMMARY
            echo "| Total size | $(du -sh .next | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          fi

  security:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔒 Audit Dependencies
        run: npm audit --audit-level=critical || true
        continue-on-error: true

      - name: 🔍 Check for Secrets
        run: |
          echo "Scanning for potential secrets..."
          # Simple check for common patterns (not a replacement for proper secret scanning)
          if grep -r "sk_live_\|sk_test_\|AKIA\|AIza" --include="*.ts" --include="*.tsx" --include="*.js" --exclude-dir=node_modules . ; then
            echo "⚠️ Potential secrets found in source code!"
            exit 1
          else
            echo "✅ No secrets detected in source code"
          fi
